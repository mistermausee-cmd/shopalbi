services:
  shopalbi:
    build: .
    container_name: shopalbi
    ports:
      # host:container — change the left side if 8000 is taken on your VPS
      - "8000:8000"
    volumes:
      - shopalbi-data:/data
      # host:container — log files land in /root/logs on the VPS
      - /root/logs:/logs
    environment:
      # EU server + Premium. Full list of knobs: see .env.example
      - SHOPALBI_API_HOST=https://europe.albion-online-data.com
      - SHOPALBI_SALES_TAX=0.04
      - SHOPALBI_GANK_RATE=0.08
      - SHOPALBI_LOG_DIR=/logs
      # --- tuned for 4 vCPU / 16 GB ---
      # A price refresh is only ~25-40 API calls out of 180/min, so 5 min is
      # cheap. 90 days of history makes the VWAP (and the spike guard) far more
      # reliable for thin T7/T8 gear that trades only a few days a month.
      - SHOPALBI_CURRENT_REFRESH_MINUTES=5
      - SHOPALBI_HISTORY_REFRESH_HOURS=4
      - SHOPALBI_HISTORY_DAYS=90
      - SHOPALBI_SQLITE_CACHE_MB=1024
      - SHOPALBI_SQLITE_MMAP_MB=2048
      # Wider live-order retention = better depth coverage. Quantities stay
      # honest because older orders are age-discounted (see ORDER_STALE_TRUST).
      - SHOPALBI_ORDER_MAX_AGE_MINUTES=720
      - SHOPALBI_BM_ORDER_MAX_AGE_MINUTES=120
      # Optional password protection (leave empty to keep the site open):
      # - SHOPALBI_AUTH_USER=admin
      # - SHOPALBI_AUTH_PASS=change-me
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else sys.exit(1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      # Keep container logs from filling the disk on a small VPS.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  shopalbi-data:
